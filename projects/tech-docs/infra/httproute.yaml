---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tech-docs-route
  namespace: tech-docs
  labels:
    app: tech-docs
spec:
  parentRefs:
  - name: greencap-gateway
    namespace: envoy-gateway-system
    sectionName: http
  hostnames:
  - "tech-docs.greencap"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: tech-docs
      port: 8000
      weight: 1
    timeouts:
      request: 30s
      backendRequest: 20s

