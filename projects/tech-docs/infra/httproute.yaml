apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tech-docs-httproute
  namespace: tech-docs
  labels:
    app: tech-docs
  annotations:
    # NGINX-specific annotations for timeout and body size configuration
    nginx.org/proxy-connect-timeout: "30s"
    nginx.org/proxy-read-timeout: "20s"
    nginx.org/client-max-body-size: "4m"
spec:
  parentRefs:
  # Bind to both HTTP and HTTPS listeners
  - name: greencap-gateway
    namespace: nginx-gateway
    sectionName: http
  - name: greencap-gateway
    namespace: nginx-gateway
    sectionName: https
  hostnames:
  - "tech-docs.greencap"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: tech-docs
      port: 8000
      weight: 100
    # Note: timeouts field is not supported in NGINX Gateway Fabric v2.2.0
    # Timeouts are configured via annotations above

