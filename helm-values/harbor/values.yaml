# Harbor Helm Values - Configuration with Gateway API
# This file contains the configuration to install Harbor via Helm using Gateway API (HTTPRoute)

expose:
  type: clusterIP
  clusterIP:
    name: harbor
    ports:
      httpPort: 80
      httpsPort: 443
      notaryPort: 4443
  tls:
    enabled: false

harborAdminPassword: Harbor12345

persistence:
  persistentVolumeClaim:
    registry:
      size: 5Gi
    chartmuseum:
      size: 5Gi
    jobservice:
      size: 1Gi
    database:
      size: 1Gi
    redis:
      size: 1Gi
    trivy:
      size: 5Gi
    notary:
      size: 1Gi

# Resource configurations
core:
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 200m

jobservice:
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 200m

registry:
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 200m

chartmuseum:
  resources:
    requests:
      memory: 128Mi
      cpu: 50m
    limits:
      memory: 256Mi
      cpu: 100m

trivy:
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 200m

notary:
  resources:
    requests:
      memory: 128Mi
      cpu: 50m
    limits:
      memory: 256Mi
      cpu: 100m

database:
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 200m

redis:
  resources:
    requests:
      memory: 128Mi
      cpu: 50m
    limits:
      memory: 256Mi
      cpu: 100m

# Security configurations
secretKey: not-a-secure-key

# Network configurations
# Access via Gateway API: HTTP on port 30001, HTTPS on port 30002
externalURL: http://core.harbor.greencap:30001

# Component configurations
chartmuseum:
  enabled: true

trivy:
  enabled: true

notary:
  enabled: true

# Metrics configurations
metrics:
  enabled: false

# Cache configurations
cache:
  enabled: true
  expireHours: 24 