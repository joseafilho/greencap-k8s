apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kubernetes-dashboard
  namespace: kubernetes-dashboard
  labels:
    app: kubernetes-dashboard
  annotations:
    # Using HTTP→HTTPS proxy service for proper backend communication
    # The proxy (dashboard-proxy) handles the HTTPS connection to the dashboard backend
    nginx.org/proxy-connect-timeout: "30s"
    nginx.org/proxy-read-timeout: "30s"
spec:
  parentRefs:
  # Bind to both HTTP and HTTPS listeners
  - name: greencap-gateway
    namespace: nginx-gateway
    sectionName: http
  - name: greencap-gateway
    namespace: nginx-gateway
    sectionName: https
  hostnames:
  - "kubernetes-dashboard.greencap"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    # Point to the proxy service instead of direct dashboard service
    - name: dashboard-proxy
      port: 80
      weight: 100

