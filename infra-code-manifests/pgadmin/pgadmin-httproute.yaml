apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pgadmin
  namespace: postgresql
  labels:
    app: pgadmin
  annotations:
    # NGINX-specific annotations for pgAdmin
    nginx.org/proxy-connect-timeout: "30s"
    nginx.org/proxy-read-timeout: "20s"
    nginx.org/client-max-body-size: "4m"
spec:
  parentRefs:
  # Bind to both HTTP and HTTPS listeners
  - name: greencap-gateway
    namespace: nginx-gateway
    sectionName: http
  - name: greencap-gateway
    namespace: nginx-gateway
    sectionName: https
  hostnames:
  - "pgadmin.greencap"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: pgadmin-pgadmin4
      port: 80
      weight: 100

