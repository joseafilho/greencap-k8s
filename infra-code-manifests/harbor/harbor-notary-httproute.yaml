apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: harbor-notary
  namespace: harbor
  labels:
    app: harbor
  annotations:
    # NGINX-specific annotations for Harbor notary service
    nginx.org/client-max-body-size: "0"
    nginx.org/proxy-read-timeout: "600s"
    nginx.org/proxy-send-timeout: "600s"
    nginx.org/proxy-connect-timeout: "30s"
spec:
  parentRefs:
  # Bind to both HTTP and HTTPS listeners
  - name: greencap-gateway
    namespace: nginx-gateway
    sectionName: http
  - name: greencap-gateway
    namespace: nginx-gateway
    sectionName: https
  hostnames:
  - "notary.harbor.greencap"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: harbor-notary-server
      port: 4443
      weight: 100

